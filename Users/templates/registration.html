{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body>
  {% include 'non_log.html' %}

    <div class='mx-auto w-1/2 my-9'>

            <div>

                {% if messages %}
                {% for message in  messages %}
            
                <div class="px-2 py-1 {% if message.tags == 'success' %}bg-green-500{% endif %}">
                        {{ message }}
                 </div>
                {% endfor %}                
                {% endif %}
            </div>
          
        <form  method="POST">
            {% csrf_token %}
            {{form}} 
            <button type='submit' class='bg-blue-500 px-2 py-1 rounded-sm text-white mt-3'>sign up</button>
        </form>
    </div>
</body>
</html>
