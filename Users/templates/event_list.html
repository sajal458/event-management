{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-gray-100 p-8">

<div class="max-w-5xl mx-auto bg-white shadow-md rounded-lg p-6">

    <h2 class="text-2xl font-bold mb-6 text-center">Event List</h2>

    <table class="w-full border border-gray-200 rounded-lg overflow-hidden">
        
        <!-- Table Head -->
        <thead class="bg-gray-200">
            <tr>
                <th class="text-left p-3">Event Name</th>
                <th class="text-center p-3">Actions</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>

        {% for event in events %}
            <tr class="border-b hover:bg-gray-50 transition">
                
                <!-- Event Name -->
                <td class="p-4 font-medium">
                    {{ event.name }}
                </td>

                <!-- Actions -->
                <td class="p-4">
    <div class="flex justify-center gap-3">

        <!-- EDIT BUTTON -->
        <a href="{% url 'event-edit' event.id %}"
   class="inline-block bg-green-500 hover:bg-yellow-600 text-white px-4 py-1 rounded-md text-sm font-semibold shadow">
    Edit
</a>

        <!-- DELETE BUTTON -->
        <form method="POST" action="{% url 'event-delete' event.id %}"
              onsubmit="return confirm('Are you sure you want to delete this event?');">
            {% csrf_token %}
            <button type="submit"
                    class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">
                Delete
            </button>
        </form>

    </div>
</td>

            </tr>
        {% endfor %}

        </tbody>
    </table>

</div>

</body>
</html>
