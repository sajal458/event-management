{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
  </head>
  <body class='bg-orange-100'>
    <div class="bg-blue-500 text-white p-4">
      <div class="flex justify-between items-center">
        <div class="text-lg font-bold">
          Sajal
        </div>
        <div class="mr-6">
         

          {% if not user.is_authenticated %}
            <a href="{% url 'homes' %}">Home</a> 
            <a href="{% url 'sign-up' %}" class="ml-4">Sign Up</a>
            <a href="{% url 'sign-in' %}" class="ml-4">Sign In</a>
          {% else %}
           
              <a href="{% url 'select-dashboard' %}">Dashboard</a>
<a href="{% url 'create' %}" class="ml-4">Create Event</a>
<a href="{% url 'add_category' %}" class="ml-4">Add Category</a>
<a href="{% url 'profile' %}" class="ml-4 bg-green-500 px-4 py-2 rounded-md">My Status</a>

<a href="{% url 'sign-out' %}" class="ml-4 bg-red-500 px-3 py-2 rounded">Sign Out</a>               
            
          {% endif %}
        </div>
      </div>
    </div>  
    {% block event %}
    {% endblock event %}
  </body>
</html>
