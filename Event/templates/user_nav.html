{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Brand Name{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-50">

    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            
            <div class="text-xl font-bold tracking-tight">
                <a href="{% url 'homes' %}">Brand Name</a>
            </div>

            <div class="flex items-center space-x-6">
                {% if not user.is_authenticated %}
                    <a href="{% url 'homes' %}" class="hover:text-blue-200 transition">Home</a>
                    <a href="{% url 'sign-up' %}" class="hover:text-blue-200 transition">Sign Up</a>
                    <a href="{% url 'sign-in' %}" class="bg-white text-blue-600 px-4 py-2 rounded-md font-medium hover:bg-blue-50 transition">
                        Sign In
                    </a>
                {% else %}
                    <div class="flex items-center gap-4">
    <a href="{% url 'select-dashboard' %}" class="hover:text-blue-200 transition">
        Home
    </a>

    <a href="{% url 'profile' %}" class="bg-green-500 hover:bg-red-600 px-4 py-2 rounded-md transition text-sm font-semibold">
        My Status
    </a>

    <a href="{% url 'sign-out' %}" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-md transition text-sm font-semibold">
        Sign Out
    </a>
</div>
                {% endif %}
            </div>
            
        </div>
    </nav>

    <main>
        {% block events %}
        {% endblock events %}
    </main>

</body>
</html>
