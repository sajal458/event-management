{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
  </head>
  <body class='bg-orange-100'>
    <div class="bg-blue-500 text-white p-4">
      <div class="flex justify-between items-center">
        <div class="text-lg font-bold">
          Sajal
        </div>
        <div class="mr-6">
          <a href="" class="mr-4 hover:underline">Home</a>

          {% if not user.is_authenticated %}
            <a href="{% url 'homes' %}">Home</a> 
            <a href="{% url 'sign-up' %}" class="ml-4">Sign Up</a>
            <a href="{% url 'sign-in' %}" class="ml-4">Sign In</a>
          {% else %}
           
              <a href="{% url 'select-dashboard' %}" class="ml-4">Dashboard</a> 
              
              <a href="{% url 'create' %}" class="ml-4">create event</a>  
              <a href="{% url 'add_category' %}" class="ml-4">add category</a>
              <a href="{% url 'sign-out' %}" class="bg-red-500 px-2 py-1 rounded">                  
            
          {% endif %}
        </div>
      </div>
    </div>
  {% block event %}
  

  {% endblock event %}
  </body>
</html>
